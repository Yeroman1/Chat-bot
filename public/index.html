<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YeroeAI | Next-Gen AI Assistant</title>
  <!-- Google Fonts: Outfit (headings) and Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- Style Sheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Ambient Animated Background Glows -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>

  <!-- Main Grid/Container -->
  <main class="app-container">
    <!-- Glassmorphic Chat Panel -->
    <div class="chat-card" id="chatCard">

      <!-- Card Header -->
      <header class="chat-header">
        <div class="header-left">
          <!-- Animated AI Logo -->
          <div class="logo-container">
            <svg class="ai-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#00f2fe" />
                  <stop offset="100%" stop-color="#4facfe" />
                </linearGradient>
                <linearGradient id="logoGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#7d5fff" stop-opacity="0.8" />
                  <stop offset="100%" stop-color="#ae89ff" stop-opacity="0.3" />
                </linearGradient>
              </defs>
              <!-- Outer Orbiting Ring -->
              <circle cx="50" cy="50" r="42" stroke="url(#logoGrad2)" stroke-width="2" fill="none"
                stroke-dasharray="10 5" class="orbiting-ring" />
              <!-- Middle Core Hexagon -->
              <polygon points="50,22 74,36 74,64 50,78 26,64 26,36" stroke="url(#logoGrad)" stroke-width="3" fill="none"
                class="core-hexagon" />
              <!-- Inner Pulsing Core -->
              <circle cx="50" cy="50" r="10" fill="url(#logoGrad)" class="pulsing-core" />
            </svg>
            <div class="status-badge"></div>
          </div>

          <div class="header-titles">
            <h1>YeroeAI</h1>
            <div class="status-container">
              <span class="status-dot"></span>
              <span class="status-text">Ask anything</span>
            </div>
          </div>
        </div>

        <div class="header-right">
      </header>
    </div>
  </main>
</body>

</html>
