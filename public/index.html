<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YeroeAI | Next-Gen AI Assistant</title>
  <!-- Google Fonts: Outfit (headings) and Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- Style Sheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Ambient Animated Background Glows -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>

  <!-- Main Grid/Container -->
  <main class="app-container">
    <!-- Glassmorphic Chat Panel -->
    <div class="chat-card" id="chatCard">

      <!-- Card Header -->
      <header class="chat-header">
        <div class="header-left">
          <!-- Animated AI Logo -->
          <div class="logo-container">
            <svg class="ai-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#00f2fe" />
                  <stop offset="100%" stop-color="#4facfe" />
                </linearGradient>
                <linearGradient id="logoGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#7d5fff" stop-opacity="0.8" />
                  <stop offset="100%" stop-color="#ae89ff" stop-opacity="0.3" />
                </linearGradient>
              </defs>
              <!-- Outer Orbiting Ring -->
              <circle cx="50" cy="50" r="42" stroke="url(#logoGrad2)" stroke-width="2" fill="none"
                stroke-dasharray="10 5" class="orbiting-ring" />
              <!-- Middle Core Hexagon -->
              <polygon points="50,22 74,36 74,64 50,78 26,64 26,36" stroke="url(#logoGrad)" stroke-width="3" fill="none"
                class="core-hexagon" />
              <!-- Inner Pulsing Core -->
              <circle cx="50" cy="50" r="10" fill="url(#logoGrad)" class="pulsing-core" />
            </svg>
            <div class="status-badge"></div>
          </div>

          <div class="header-titles">
            <h1>YeroeAI</h1>
            <div class="status-container">
              <span class="status-dot"></span>
              <span class="status-text">Ask anything</span>
            </div>
          </div>
        </div>

        <div class="header-right">
          <!-- Voice Mode Controls -->
          <div class="voice-control-container">
            <button id="voiceToggleBtn" class="btn-voice-toggle" title="Toggle Voice Mode (ON/OFF)">
              <svg class="icon-speaker" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path class="volume-waves" d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              </svg>
              <span class="voice-status-label">Voice OFF</span>
              <div class="voice-visualizer hidden" id="voiceVisualizer">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
              </div>
            </button>
            <button id="voiceSettingsBtn" class="btn-voice-settings" title="Voice Settings">
              <svg class="icon-cog" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
                </path>
              </svg>
            </button>

            <!-- Voice Settings Dropdown -->
            <div class="voice-settings-dropdown hidden" id="voiceSettingsDropdown">
              <div class="dropdown-header">
                <h3>Voice Settings</h3>
              </div>
              <div class="dropdown-body">
                <div class="setting-field">
                  <label for="voiceSelect">Select Accent/Voice</label>
                  <select id="voiceSelect" class="voice-select"></select>
                </div>
                <div class="setting-field">
                  <div class="label-wrapper">
                    <label for="voiceSpeed">Playback Speed</label>
                    <span id="speedVal">1.0x</span>
                  </div>
                  <input type="range" id="voiceSpeed" min="0.5" max="2.0" step="0.1" value="1.0"
                    class="voice-speed-slider">
                </div>
              </div>
            </div>
          </div>

          <!-- New Chat Button -->
          <button id="newChatBtn" class="btn-new-chat" title="Start a New Chat">
            <svg class="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
            <span>New Chat</span>
          </button>
        </div>
      </header>

      <!-- Chat Messages Workspace -->
      <section class="messages-container" id="messagesContainer">

        <!-- Welcome Message -->
        <div class="message message-ai welcome-message animate-fade-in">
          <div class="avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12A10 10 0 0 1 12 2z" />
              <path d="M12 8v8M8 12h8" />
            </svg>
          </div>
          <div class="message-bubble">
            <p>Greetings. I am <strong>YeroeAI</strong>, a conversational assistant. How can I
              assist you with your project, design, or ideas today?</p>
            <span class="message-time">Just now</span>
          </div>
        </div>

        <!-- Dynamic messages will be appended here by script.js -->

        <!-- Typing Indicator Container -->
        <div class="message message-ai typing-indicator-container hidden" id="typingIndicator">
          <div class="avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12A10 10 0 0 1 12 2z" />
              <path d="M12 8v8M8 12h8" />
            </svg>
          </div>
          <div class="message-bubble typing-bubble">
            <div class="typing-dots">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
        </div>

      </section>

    </div>
  </main>
</body>

</html>
